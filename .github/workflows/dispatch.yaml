name: Update Submodule

on:
  repository_dispatch:
    types: [openapi-update]

permissions:
  contents: read

jobs:
  check_submodules_for_updates:
    timeout-minutes: 10

    runs-on: ubuntu-latest

    # Pushes and the PR are done with the GitHub App token; GITHUB_TOKEN is
    # only used to list existing submodule PRs.
    permissions:
      contents: read
      pull-requests: read

    outputs:
      pr-list: ${{ steps.pr-list.outputs.pr-list }}
      status: ${{ steps.status.outputs.status }}

    strategy:
      matrix:
        node-version: [24]

    steps:
      - name: Setup node 🏗
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Put node version 📺
        shell: bash
        run: echo "The version of Node.js used is $(node -v)"

      - name: Get GitHub API token 🔐
        id: get-github-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout 🛎
        uses: actions/checkout@v7
        with:
          token: ${{ steps.get-github-token.outputs.token }}
          submodules: recursive

      - name: Update submodules
        id: update
        run: git submodule update --remote --recursive

      - name: Run git status
        id: status
        run: echo "status=$(git status -s)" >> "$GITHUB_OUTPUT"

      - name: Get Submodule PR
        id: pr-list
        if: ${{ steps.status.outputs.status }}
        run: |
          pr_list=$(gh pr list --label "submodule" --json number | jq '[.[].number]')
          echo "pr-list=$(jq -c . <<< "$pr_list")" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get the latest merge PR for OpenAPI
        id: openapi-pr
        if: ${{ steps.status.outputs.status }}
        run: |
          merged_pr=$(
            curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $APP_TOKEN" \
            "https://api.github.com/search/issues?q=repo:kamegoro/create-repository-check-operation-of-dispatch-events+is:pr+is:merged"
          )
          echo "merged-pr=$(jq -c '.items[0]' <<< "$merged_pr")" >> "$GITHUB_OUTPUT"
        env:
          APP_TOKEN: ${{ steps.get-github-token.outputs.token }}

      - name: Install Node.js
        if: ${{ steps.status.outputs.status }}
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        if: ${{ steps.status.outputs.status }}
        run: npm install

      - name: Create Branch Name
        if: ${{ steps.status.outputs.status }}
        env:
          TZ: "Asia/Tokyo"
        run: echo "SUBMODULE_BRANCH_NAME=feature/Update-submodules-$(date +'%Y-%m-%d_%H-%M')" >> "$GITHUB_ENV"

      - name: Create new Branch
        if: ${{ steps.status.outputs.status }}
        id: branch
        run: |
          git checkout -b "$SUBMODULE_BRANCH_NAME"

      - name: Generate Orval
        if: ${{ steps.status.outputs.status }}
        run: npm run orval

      - name: commit and push files
        if: ${{ steps.status.outputs.status }}
        run: |
          git add .
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git commit -m "Update submodules at $(date "+%Y-%m-%d %H:%M:%S")"
          git push origin "$SUBMODULE_BRANCH_NAME"

      - name: Create PR
        if: ${{ steps.status.outputs.status }}
        # PR text comes from another repository, so it is passed through env
        # instead of being interpolated into the script.
        run: |
          gh pr create \
            -B main \
            -H "$SUBMODULE_BRANCH_NAME" \
            --reviewer kamegoro \
            --title "$OPENAPI_PR_TITLE" \
            --body "
          ## OpenAPIの更新

          - [#$OPENAPI_PR_NUMBER $OPENAPI_PR_TITLE]($OPENAPI_PR_URL)

          $OPENAPI_PR_BODY
          "
        env:
          GITHUB_TOKEN: ${{ steps.get-github-token.outputs.token }}
          OPENAPI_PR_NUMBER: ${{ fromJson(steps.openapi-pr.outputs.merged-pr).number }}
          OPENAPI_PR_TITLE: ${{ fromJson(steps.openapi-pr.outputs.merged-pr).title }}
          OPENAPI_PR_URL: ${{ fromJson(steps.openapi-pr.outputs.merged-pr).html_url }}
          OPENAPI_PR_BODY: ${{ fromJson(steps.openapi-pr.outputs.merged-pr).body }}

  close_old_pr:
    needs: check_submodules_for_updates
    if: needs.check_submodules_for_updates.outputs.status && !contains(toJson(needs.check_submodules_for_updates.outputs.pr-list), '[]')

    timeout-minutes: 10

    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    strategy:
      matrix:
        value: ${{ fromJson(needs.check_submodules_for_updates.outputs.pr-list) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Close PR
        run: |
          gh pr close "$PR_NUMBER" --delete-branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ matrix.value }}
